<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kladionica Pro</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <header>
        <h1>Kladionica <span class="accent">Pro</span></h1>
        <div id="balance-container">
          Balance: $<span id="balance-val">1000</span>
        </div>
      </header>

      <section class="game-area">
        <div class="status-card" id="status-card">
          <p id="game-msg">Welcome, Player!</p>
        </div>

        <form id="bet-form" class="bet-form">
          <div class="input-group">
            <label for="bet-amount">Bet Amount</label>
            <input type="number" id="bet-amount" value="10" min="1" />
          </div>
          <button type="submit" id="bet-btn">Place Bet</button>
        </form>
      </section>

      <footer>
        <p>Shortcut: <kbd>Ctrl+B</kbd> to show window</p>
      </footer>
    </main>
  </body>
</html>
